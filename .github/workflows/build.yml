            Widget _brand() {
              final a = cBlue;
              final b = cCyan;
              Shader grad(Rect r) => LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: [a, b],
                  ).createShader(r);
              return Directionality(
                textDirection: TextDirection.ltr,
                child: Column(
                  children: [
                    Container(
                      width: 96,
                      height: 96,
                      padding: const EdgeInsets.all(3),
                      decoration: BoxDecoration(
                        shape: BoxShape.circle,
                        gradient: LinearGradient(
                          begin: Alignment.topLeft,
                          end: Alignment.bottomRight,
                          colors: [a, b.withOpacity(0.25)],
                        ),
                        boxShadow: [
                          BoxShadow(color: a.withOpacity(0.55), blurRadius: 32, spreadRadius: 1),
                        ],
                      ),
                      child: Container(
                        alignment: Alignment.center,
                        decoration: BoxDecoration(shape: BoxShape.circle, color: cBg0),
                        child: ShaderMask(
                          blendMode: BlendMode.srcIn,
                          shaderCallback: grad,
                          child: const Text(
                            'E',
                            style: TextStyle(
                              fontSize: 56,
                              fontWeight: FontWeight.w900,
                              color: Colors.white,
                              height: 1.0,
                            ),
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    ShaderMask(
                      blendMode: BlendMode.srcIn,
                      shaderCallback: grad,
                      child: const Text(
                        'ERFAN',
                        style: TextStyle(
                          fontSize: 46,
                          fontWeight: FontWeight.w900,
                          letterSpacing: 8,
                          color: Colors.white,
                          height: 1.1,
                        ),
                      ),
                    ),
                    const SizedBox(height: 2),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Container(
                          width: 46,
                          height: 2,
                          decoration: BoxDecoration(
                            gradient: LinearGradient(colors: [a.withOpacity(0), a]),
                          ),
                        ),
                        const SizedBox(width: 12),
                        Padding(
                          padding: const EdgeInsets.only(left: 10),
                          child: Text(
                            'VPN',
                            style: TextStyle(
                              fontSize: 20,
                              fontWeight: FontWeight.w800,
                              letterSpacing: 10,
                              color: b,
                            ),
                          ),
                        ),
                        const SizedBox(width: 12),
                        Container(
                          width: 46,
                          height: 2,
                          decoration: BoxDecoration(
                            gradient: LinearGradient(colors: [a, a.withOpacity(0)]),
                          ),
                        ),
                      ],
                    ),
                  ],
                ),
              );
            }

