            // ----- ناوبری پایین -----

            Widget _navItem(int i, IconData off, IconData on, String label) {
              final sel = _tab == i;
              return Expanded(
                child: InkWell(
                  onTap: () => setState(() => _tab = i),
                  child: Padding(
                    padding: const EdgeInsets.only(top: 10),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Icon(sel ? on : off, size: 28, color: sel ? cBlue : Colors.white60),
                        const SizedBox(height: 4),
                        Text(label,
                            style: TextStyle(
                                fontSize: 12, color: sel ? cBlue : Colors.white60)),
                        const SizedBox(height: 6),
                        AnimatedContainer(
                          duration: const Duration(milliseconds: 250),
                          height: 3,
