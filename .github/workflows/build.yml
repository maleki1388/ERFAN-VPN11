name: Build ERFAN VPN
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project
        run: flutter create --org com.erfan --project-name erfan --platforms=android app

      - name: Write app code
        run: |
          rm -rf app/test
          cat > app/lib/main.dart <<'DART_EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math' as math;


          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_v2ray/flutter_v2ray.dart';

          import 'package:http/http.dart' as http;
          import 'dart:io';

          import 'package:image_picker/image_picker.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:camera/camera.dart';
          import 'package:zxing2/qrcode.dart';
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/foundation.dart' show compute;
          import 'package:shared_preferences/shared_preferences.dart';

          // ============================================================
          //  ثابت‌ها و زبان
          // ============================================================

          const appName = 'ERFAN VPN';
          const cGreen = Color(0xFF00E676);

          Color _hsl(double h, double s, double l) => HSLColor.fromAHSL(
                  1, h % 360, s.clamp(0.0, 1.0).toDouble(), l.clamp(0.0, 1.0).toDouble())
              .toColor();

          class AppTheme {
            final String fa, en;
            final Color bg0, bg1, accent, accent2, line, surface, nav, navLine;
            final Color btnFill, btnIn, btnInLine, idle, card, selected, panel;
            AppTheme(this.fa, this.en,
                {required this.bg0,
                required this.bg1,
                required this.accent,
                required this.accent2,
                required this.line,
                required this.surface,
                required this.nav,
                required this.navLine,
                required this.btnFill,
                required this.btnIn,
                required this.btnInLine,
                required this.idle,
                required this.card,
                required this.selected,
                required this.panel});
          }

          AppTheme _mk(String fa, String en,
              {required double acc,
              double accSat = 1.0,
              double accL = 0.56,
              required double tint,
              double tintSat = 0.65,
              Color? top,
              Color? bottom}) {
            return AppTheme(fa, en,
                bg0: bottom ?? _hsl(tint, tintSat, 0.03),
                bg1: top ?? _hsl(tint, tintSat, 0.11),
                accent: _hsl(acc, accSat, accL),
                accent2: _hsl(acc + 8, accSat, accL + 0.05),
                line: _hsl(acc, accSat * 0.7, accL * 0.8),
                surface: _hsl(tint, tintSat, 0.085),
                nav: _hsl(tint, tintSat, 0.045),
                navLine: _hsl(tint, tintSat * 0.9, 0.14),
                btnFill: _hsl(tint, tintSat, 0.055),
                btnIn: _hsl(tint, tintSat * 0.85, 0.09),
                btnInLine: _hsl(tint, tintSat * 0.8, 0.17),
                idle: _hsl(acc, accSat * 0.6, 0.48),
                card: _hsl(tint, tintSat, 0.10),
                selected: _hsl(tint, tintSat * 0.8, 0.24),
                panel: _hsl(tint, tintSat, 0.065));
          }

          final List<AppTheme> kThemes = [
            _mk('آبی', 'Blue', acc: 208, tint: 222),
            _mk('بنفش', 'Purple', acc: 270, tint: 268),
            _mk('قرمز', 'Red', acc: 355, tint: 355),
            _mk('سبز', 'Green', acc: 145, tint: 150),
            _mk('زرد', 'Yellow', acc: 48, accL: 0.55, tint: 45, tintSat: 0.6),
            _mk('نارنجی', 'Orange', acc: 24, tint: 22),
            _mk('صورتی', 'Pink', acc: 325, tint: 325),
            _mk('مشکی', 'Black',
                acc: 0, accSat: 0, accL: 0.85, tint: 0, tintSat: 0,
                top: const Color(0xFF111111), bottom: const Color(0xFF000000)),
            _mk('قرمز و مشکی', 'Red × Black',
                acc: 355, tint: 355, tintSat: 0.55,
                top: const Color(0xFF45000A), bottom: const Color(0xFF000000)),
            _mk('طلایی و مشکی', 'Gold × Black',
                acc: 45, accL: 0.55, tint: 42, tintSat: 0.5,
                top: const Color(0xFF3A2A00), bottom: const Color(0xFF000000)),
            _mk('بنفش و آبی', 'Purple × Blue',
                acc: 262, tint: 250, tintSat: 0.6,
                top: const Color(0xFF2E1065), bottom: const Color(0xFF020A2E)),
            _mk('صورتی و بنفش', 'Pink × Purple',
                acc: 315, tint: 300, tintSat: 0.55,
                top: const Color(0xFF5A0E4A), bottom: const Color(0xFF14062A)),
            _mk('سبز و مشکی', 'Green × Black',
                acc: 140, tint: 150, tintSat: 0.55,
                top: const Color(0xFF00421C), bottom: const Color(0xFF000000)),
            _mk('آتش', 'Fire',
                acc: 18, tint: 10, tintSat: 0.6,
                top: const Color(0xFF5A1A00), bottom: const Color(0xFF1C0004)),
            _mk('اقیانوس', 'Ocean',
                acc: 185, tint: 200, tintSat: 0.6,
                top: const Color(0xFF004050), bottom: const Color(0xFF020F22)),
          ];

          final ValueNotifier<int> themePref = ValueNotifier<int>(0);

          AppTheme get curTheme {
            final i = themePref.value;
            return kThemes[(i < 0 || i >= kThemes.length) ? 0 : i];
          }

          Color get cBg0 => curTheme.bg0;
          Color get cBg1 => curTheme.bg1;
          Color get cBlue => curTheme.accent;
          Color get cCyan => curTheme.accent2;
          Color get cLine => curTheme.line;
          Color get cAccent => curTheme.accent;
          Color get cCard => curTheme.card;
          Color get cSelected => curTheme.selected;
          Color get cPanel => curTheme.panel;
          Color get cCardA => curTheme.card.withOpacity(0.93);
          Color get cSurface => curTheme.surface;
          Color get cNav => curTheme.nav;
          Color get cNavLine => curTheme.navLine;
          Color get cBtnFill => curTheme.btnFill;
          Color get cBtnIn => curTheme.btnIn;
          Color get cBtnInLine => curTheme.btnInLine;
          Color get cIdle => curTheme.idle;


          final ValueNotifier<String> langPref = ValueNotifier<String>('fa');

          bool get isFa {
            return langPref.value != 'en';
          }

          String tr(String fa, String en) => isFa ? fa : en;

          // ============================================================
          //  تنظیمات برنامه (ذخیره‌شده)
          // ============================================================

          class AppSettings {
            String lang = 'fa';
            bool autoBest = true;
            bool autoSwitch = true;
            bool autoUpdate = true;
            bool autoSpeed = false;
            bool autoReconnect = false;
            bool wantOn = false;
            bool perf = true;
            int theme = 0;
            bool fragment = false;
            int ver = 0;
            bool permOk = false;
            String ua = 'v2rayNG/1.8.5';
            bool proxyOnly = false;
            bool bypassLan = false;
            String dnsPreset = 'default';
            String dnsCustom = '';
            String domainStrategy = 'default';
            bool bypassIr = false;
            String directDomains = '';
            String blockDomains = '';
            String deviceId = '';

            Map<String, dynamic> toMap() => {
                  'lang': lang,
                  'autoSpeed': autoSpeed,
           'autoReconnect': autoReconnect,
           'wantOn': wantOn,
           'perf': perf,
           'theme': theme,
           'fragment': fragment,
                  'ver': ver,
           'permOk': permOk,
                  'autoBest': autoBest,
                  'autoSwitch': autoSwitch,
                  'autoUpdate': autoUpdate,
                  'ua': ua,
                  'proxyOnly': proxyOnly,
                  'bypassLan': bypassLan,
                  'dnsPreset': dnsPreset,
                  'dnsCustom': dnsCustom,
                  'domainStrategy': domainStrategy,
                  'bypassIr': bypassIr,
                  'directDomains': directDomains,
                  'blockDomains': blockDomains,
                  'deviceId': deviceId,
                };

            Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              final raw = p.getString('settings');
              if (raw != null) {
                try {
                  final m = jsonDecode(raw) as Map<String, dynamic>;
                  lang = (m['lang'] ?? lang) as String;
                  autoSpeed = (m['autoSpeed'] ?? autoSpeed) as bool;
           autoReconnect = (m['autoReconnect'] ?? autoReconnect) as bool;
           wantOn = (m['wantOn'] ?? wantOn) as bool;
           perf = (m['perf'] ?? perf) as bool;
           theme = (m['theme'] ?? theme) as int;
           fragment = (m['fragment'] ?? fragment) as bool;
                  ver = (m['ver'] ?? 0) as int;
           permOk = (m['permOk'] ?? permOk) as bool;
                  autoBest = (m['autoBest'] ?? autoBest) as bool;
                  autoSwitch = (m['autoSwitch'] ?? autoSwitch) as bool;
                  autoUpdate = (m['autoUpdate'] ?? autoUpdate) as bool;
                  ua = (m['ua'] ?? ua) as String;
                  proxyOnly = (m['proxyOnly'] ?? proxyOnly) as bool;
                  bypassLan = (m['bypassLan'] ?? bypassLan) as bool;
                  dnsPreset = (m['dnsPreset'] ?? dnsPreset) as String;
                  dnsCustom = (m['dnsCustom'] ?? dnsCustom) as String;
                  domainStrategy = (m['domainStrategy'] ?? domainStrategy) as String;
                  bypassIr = (m['bypassIr'] ?? bypassIr) as bool;
                  directDomains = (m['directDomains'] ?? directDomains) as String;
                  blockDomains = (m['blockDomains'] ?? blockDomains) as String;
                  deviceId = (m['deviceId'] ?? deviceId) as String;
                } catch (_) {}
              }
              if (ver < 2) {
                // نسخه جدید: وصل شدن خودکار و فرگمنت پیش‌فرض خاموش
                fragment = false;
                autoSpeed = false;
                autoReconnect = false;
                wantOn = false;
                ver = 2;
                await save();
              }
              if (lang != 'en') lang = 'fa';
              if (deviceId.isEmpty) {
                deviceId = _uuid();
                await save();
              }
              themePref.value = (theme < 0 || theme >= kThemes.length) ? 0 : theme;
              langPref.value = lang;
            }

            Future<void> save() async {
              final p = await SharedPreferences.getInstance();
              await p.setString('settings', jsonEncode(toMap()));
            }

            List<String> listOf(String s) => s
                .split(RegExp(r'[,\s]+'))
                .map((e) => e.trim().toLowerCase())
                .where((e) => e.isNotEmpty)
                .toList();

            List<String> dnsServers() {
              switch (dnsPreset) {
                case 'google':
                  return ['8.8.8.8', '8.8.4.4'];
                case 'cloudflare':
                  return ['1.1.1.1', '1.0.0.1'];
                case 'quad9':
                  return ['9.9.9.9', '149.112.112.112'];
                case 'adguard':
                  return ['94.140.14.14', '94.140.15.15'];
                case 'custom':
                  return dnsCustom
                      .split(RegExp(r'[,\s]+'))
                      .map((e) => e.trim())
                      .where((e) => e.isNotEmpty)
                      .toList();
                default:
                  return [];
              }
            }
          }

          final AppSettings S = AppSettings();

          String _uuid() {
            final r = math.Random.secure();
            final b = List<int>.generate(16, (_) => r.nextInt(256));
            b[6] = (b[6] & 0x0f) | 0x40;
            b[8] = (b[8] & 0x3f) | 0x80;
            String h(int i) => b[i].toRadixString(16).padLeft(2, '0');
            return '${h(0)}${h(1)}${h(2)}${h(3)}-${h(4)}${h(5)}-${h(6)}${h(7)}-${h(8)}${h(9)}-${h(10)}${h(11)}${h(12)}${h(13)}${h(14)}${h(15)}';
          }

          // ============================================================
          //  main
          // ============================================================

          Future<void> main() async {
            await runZonedGuarded(() async {
              WidgetsFlutterBinding.ensureInitialized();
              ErrorWidget.builder = (details) => Material(
                    color: Colors.black,
                    child: Center(
                      child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Text(details.exceptionAsString(),
                            style: const TextStyle(color: Colors.redAccent, fontSize: 12)),
                      ),
                    ),
                  );
              try {
                await S.load();
              } catch (_) {}
              runApp(const ErfanApp());
            }, (error, stack) {});
          }

          class ErfanApp extends StatelessWidget {
            const ErfanApp({super.key});

            @override
            Widget build(BuildContext context) {
              return ValueListenableBuilder<int>(
                valueListenable: themePref,
                builder: (_, __, ___) => MaterialApp(
                title: appName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  colorScheme: ColorScheme.fromSeed(
                      seedColor: cAccent, brightness: Brightness.dark),
                  scaffoldBackgroundColor: Colors.transparent,
                ),
                builder: (context, child) => ValueListenableBuilder<String>(
                  valueListenable: langPref,
                  builder: (_, __, ___) => Directionality(
                    textDirection: isFa ? TextDirection.rtl : TextDirection.ltr,
                    child: child!,
                  ),
                ),
                home: const HomePage(),
              ));
            }
          }

          // ============================================================
          //  مدل‌ها
          // ============================================================

          class Cfg {
            final String link; // لینک کانفیگ یا متن JSON کامل
            final String? sub; // آدرس ساب (اگه از ساب اومده)
            Cfg(this.link, this.sub);

            bool get isJson => link.startsWith('{');

            Map<String, dynamic> toJson() => {'l': link, 's': sub};
            factory Cfg.fromJson(Map<String, dynamic> j) =>
                Cfg(j['l'] as String, j['s'] as String?);
          }

          class SubInfo {
            String name;
            int used;
            int total;
            int expire; // epoch seconds
            SubInfo({this.name = '', this.used = 0, this.total = 0, this.expire = 0});

            Map<String, dynamic> toJson() =>
                {'n': name, 'u': used, 't': total, 'e': expire};
            factory SubInfo.fromJson(Map<String, dynamic> j) => SubInfo(
                  name: (j['n'] ?? '') as String,
                  used: (j['u'] ?? 0) as int,
                  total: (j['t'] ?? 0) as int,
                  expire: (j['e'] ?? 0) as int,
                );
          }

          class CfgGroup {
            final String? sub;
            final String title;
            final List<Cfg> items;
            CfgGroup(this.sub, this.title, this.items);
          }

          class SubRow {
            final String title;
            final int count;
            final int used;
            final int total;
            final int expire;
            SubRow(this.title, this.count, this.used, this.total, this.expire);
          }

          String _gb(int b) => '${(b / 1073741824).toStringAsFixed(1)} GB';

          int? _daysLeft(int expire) {
            if (expire <= 0) return null;
            final ms = expire * 1000 - DateTime.now().millisecondsSinceEpoch;
            return (ms / 86400000).ceil();
          }

          // ============================================================
          //  Home
          // ============================================================

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> with WidgetsBindingObserver {
            late final FlutterV2ray _v2ray;
            V2RayStatus _status = V2RayStatus();

            int _tab = 0; // 0 خانه، 1 پیکربندی‌ها، 2 تنظیمات

            List<Cfg> _configs = [];
            List<String> _subs = [];
            final Map<String, SubInfo> _subInfo = {};
            final Map<String, int> _pings = {};
            final Map<String, String> _names = {};
            final Map<String, String> _hosts = {};
            final Map<String, String> _custom = {};
            final Set<String> _collapsed = {};
            final Set<String> _busyPing = {};
            final Set<String> _busyUpd = {};
            List<Object> _rows = [];
            String? _selected;
            int _sort = 0; // 0 پینگ، 1 نام، 2 پیش‌فرض

            bool _updatingSubs = false;
            bool _pinging = false;
            bool _foreground = true;
            bool _firstRound = true;
            int _failRounds = 0;
            DateTime _lastSubUpdate = DateTime.fromMillisecondsSinceEpoch(0);
            Timer? _pingTimer;
            Timer? _liveTimer;
            bool _loaded = false;
            bool _allowEmpty = false;
            String _loadInfo = '';
            String _saveInfo = '';
            http.Client? _live;
            final Map<String, double> _speeds = {};
            final Map<String, int> _speedAt = {};
            bool _picked = false;
            bool _probing = false;
            bool _cancelProbe = false;
            bool _measuring = false;
            bool _smartBusy = false;
            String? _activeLink;
            int _livePing = 0;
            final List<double> _dlHist = [];
            final List<double> _ulHist = [];
            final List<double> _pingHist = [];
            double _dlMbps = 0;
            double _ulMbps = 0;
            double _peakDl = 0;
            int _lastDl = 0;
            int _lastUl = 0;
            final Stopwatch _tick = Stopwatch();
            final Map<String, double> _ups = {};
            final List<int> _liveSamples = [];
            int _liveN = 0;
            int _liveFails = 0;
            DateTime _lastFailover = DateTime.fromMillisecondsSinceEpoch(0);
            int _pingTick = 0;
            bool _themesOpen = false;

            bool get _connected => _status.state == 'CONNECTED';
            bool get _connecting => _status.state == 'CONNECTING';

            // هر لینکی به شکل scheme://... که http/https نباشه یک کانفیگ حساب می‌شه
            // (vless، vmess، trojan، ss، ssh، hysteria2، tuic، wireguard و ...)
            static final RegExp _linkRe = RegExp(r'^[A-Za-z][A-Za-z0-9+.\-]*://\S');
            static const _coreSchemes = [
              'vmess://',
              'vless://',
              'trojan://',
              'ss://',
              'socks://',
            ];
            bool _isLink(String s) {
              final l = s.toLowerCase();
              if (l.startsWith('http://') || l.startsWith('https://')) return false;
              return _linkRe.hasMatch(s);
            }

            /// هسته فقط همین پروتکل‌ها رو وصل می‌کنه
            bool _unsupported(Cfg c) {
              if (c.isJson) return false;
              final l = c.link.toLowerCase();
              return !_coreSchemes.any(l.startsWith);
            }

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              langPref.addListener(_onLang);
              themePref.addListener(_onLang);
              _v2ray = FlutterV2ray(onStatusChanged: _onStatus);
              _init();
            }

            void _onLang() {
              if (mounted) setState(() {});
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              langPref.removeListener(_onLang);
              themePref.removeListener(_onLang);
              _pingTimer?.cancel();
              _liveTimer?.cancel();
              _live?.close();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _foreground = true;
                if (S.autoUpdate &&
                    DateTime.now().difference(_lastSubUpdate).inSeconds > 30) {
                  _updateAllSubs();
                } else if (!_connected) {
                  _pingAll();
                }
              } else if (state == AppLifecycleState.paused) {
                _foreground = false;
                _save();
                S.save();
              }
            }

            // ---------- راه‌اندازی ----------

            Future<void> _init() async {
              try {
                await _load();
              } catch (e) {
                _toast(tr('خطا در خواندن کانفیگ‌ها: $e', 'Could not read saved configs: $e'));
              }
              _loaded = true;
              try {
                await _v2ray.initializeV2Ray();
              } catch (e) {
                _toast('V2Ray: $e');
              }
              // با ورود به برنامه هیچ اتصالی خودکار برقرار نمی‌شه؛ فقط خود کاربر وصل و قطع می‌کنه
              if (_subs.isNotEmpty && S.autoUpdate) {
                await _updateAllSubs(); // آخرش خودش پینگ دقیق می‌گیره و مرتب می‌کنه
              } else {
                _pingAll(manual: true, tries: 2);
              }

              _pingTimer = Timer.periodic(const Duration(seconds: 5), (_) {
                // وقتی وصل هستیم یا داریم وصل می‌شیم پینگ پس‌زمینه نمی‌گیریم تا اتصال لگ نکنه
                // (پینگ زنده از داخل تونل جدا گرفته می‌شه)
                if (!_foreground || _probing || _updatingSubs || _connected || _connecting) return;
                _pingTick++;
                if (_pingTick % 12 == 0) {
                  // هر یک دقیقه همه کانفیگ‌ها
                  _pingAll();
                } else {
                  // هر ۵ ثانیه فقط کانفیگ انتخاب‌شده
                  final a = _byLink(_selected);
                  if (a != null) _pingConfigs([a]);
                }
              });
              _liveTimer = Timer.periodic(const Duration(seconds: 3), (_) => _liveTick());
            }

            Future<File?> _backupFile() async {
              try {
                final d = await getApplicationSupportDirectory();
                return File('${d.path}/erfan_backup.json');
              } catch (_) {
                return null;
              }
            }

            Future<void> _writeBackup() async {
              try {
                final f = await _backupFile();
                if (f == null) return;
                final data = jsonEncode({
                  'configs': _configs.map((e) => e.toJson()).toList(),
                  'subs': _subs,
                  'selected': _selected,
                  'custom': _custom,
                });
                final tmp = File('${f.path}.tmp');
                await tmp.writeAsString(data, flush: true);
                await tmp.rename(f.path);
              } catch (_) {}
            }

            Future<Map<String, dynamic>?> _readBackup() async {
              try {
                final f = await _backupFile();
                if (f == null || !await f.exists()) return null;
                final m = jsonDecode(await f.readAsString());
                return m is Map ? Map<String, dynamic>.from(m) : null;
              } catch (_) {
                return null;
              }
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              List<Cfg> list = [];
              final raw = p.getString('configs') ?? p.getString('configs_bak');
              if (raw != null) {
                try {
                  list = (jsonDecode(raw) as List)
                      .map((e) => Cfg.fromJson(e as Map<String, dynamic>))
                      .toList();
                } catch (_) {}
              }
              final infoRaw = p.getString('subinfo');
              if (infoRaw != null) {
                try {
                  final m = jsonDecode(infoRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    _subInfo[k] = SubInfo.fromJson(Map<String, dynamic>.from(v as Map));
                  });
                } catch (_) {}
              }
              final spRaw = p.getString('speeds');
              if (spRaw != null) {
                try {
                  final m = jsonDecode(spRaw) as Map<String, dynamic>;
                  m.forEach((k, v) {
                    final mm = Map<String, dynamic>.from(v as Map);
                    _speeds[k] = (mm['s'] as num).toDouble();
                    final u = mm['u'];
                    if (u is num && u > 0) _ups[k] = u.toDouble();
                    _speedAt[k] = (mm['t'] as num).toInt();
                  });
                } catch (_) {}
              }
              final custRaw = p.getString('custom');
              if (custRaw != null) {
                try {
                  final m = jsonDecode(custRaw) as Map<String, dynamic>;
                  m.forEach((k, v) => _custom[k] = v.toString());
                } catch (_) {}
              }
              String src = 'prefs';
              List<String> subsList = p.getStringList('subs') ?? [];
              String? selected = p.getString('selected');
              if (list.isEmpty) {
                final b = await _readBackup();
                if (b != null && b['configs'] is List && (b['configs'] as List).isNotEmpty) {
                  try {
                    list = (b['configs'] as List)
                        .map((e) => Cfg.fromJson(Map<String, dynamic>.from(e as Map)))
                        .toList();
                    subsList = List<String>.from((b['subs'] as List?) ?? const []);
                    selected = b['selected'] as String?;
                    if (b['custom'] is Map) {
                      (b['custom'] as Map).forEach((k, v) => _custom[k.toString()] = v.toString());
                    }
                    src = 'file';
                  } catch (_) {}
                } else {
                  src = 'none';
                }
              }
              _loadInfo = '${list.length} • $src';
              if (!mounted) return;
              setState(() {
                _configs = list;
                _subs = subsList;
                _selected = selected;
                _sort = p.getInt('sort2') ?? 0;
           _picked = p.getBool('picked') ?? false;
                _resort();
              });
            }

            Future<void> _save() async {
              if (!_loaded) return;
              final p = await SharedPreferences.getInstance();
              // لیست خالی فقط وقتی ذخیره می‌شه که خود کاربر حذف کرده باشه
              if (_configs.isNotEmpty || _allowEmpty) {
                _saveInfo = '${_configs.length} • ${DateTime.now().toString().substring(11, 19)}';
                await _writeBackup();
                final cj = jsonEncode(_configs.map((e) => e.toJson()).toList());
                await p.setString('configs', cj);
                await p.setString('configs_bak', cj);
              }
              await p.setStringList('subs', _subs);
              await p.setString('subinfo',
                  jsonEncode(_subInfo.map((k, v) => MapEntry(k, v.toJson()))));
              await p.setString('custom', jsonEncode(_custom));
              await p.setInt('sort2', _sort);
              await p.setBool('picked', _picked);
              await p.setString(
                  'speeds',
                  jsonEncode({
                    for (final e in _speeds.entries)
                      e.key: {'s': e.value, 't': _speedAt[e.key] ?? 0, 'u': _ups[e.key] ?? 0}
                  }));
              if (_selected != null) {
                await p.setString('selected', _selected!);
              } else {
                await p.remove('selected');
              }
            }

            void _toast(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(msg)));
            }

            // ---------- کمک‌ها ----------

            String _nameOf(Cfg c) {
              final cu = _custom[c.link];
              if (cu != null && cu.isNotEmpty) return cu;
              return _names.putIfAbsent(c.link, () {
                if (c.isJson) {
                  try {
                    final j = jsonDecode(c.link);
                    if (j is Map && j['remarks'] != null) return j['remarks'].toString();
                  } catch (_) {}
                  return 'JSON';
                }
                try {
                  final r = FlutterV2ray.parseFromURL(c.link).remark;
                  return r.isEmpty ? '—' : r;
                } catch (_) {
                  final h = c.link.indexOf('#');
                  if (h >= 0 && h < c.link.length - 1) {
                    try {
                      return Uri.decodeComponent(c.link.substring(h + 1));
                    } catch (_) {}
                  }
                  return '—';
                }
              });
            }

            String _rawHost(Cfg c) {
              try {
                if (c.isJson) {
                  final j = jsonDecode(c.link);
                  if (j is Map) {
                    final ob = j['outbounds'];
                    if (ob is List && ob.isNotEmpty) {
                      final s = ob[0]['settings'];
                      if (s is Map) {
                        final v = s['vnext'];
                        if (v is List && v.isNotEmpty) {
                          return (v[0]['address'] ?? '').toString();
                        }
                        final sv = s['servers'];
                        if (sv is List && sv.isNotEmpty) {
                          return (sv[0]['address'] ?? '').toString();
                        }
                      }
                    }
                  }
                  return '';
                }
                if (c.link.startsWith('vmess://')) {
                  final raw = c.link.substring(8).split('#').first;
                  final j = jsonDecode(utf8.decode(base64.decode(base64.normalize(raw))));
                  return (j['add'] ?? '').toString();
                }
                if (c.link.startsWith('ss://')) {
                  final u = Uri.tryParse(c.link);
                  if (u != null && u.host.isNotEmpty) return u.host;
                  final body = c.link.substring(5).split('#').first;
                  final dec = utf8.decode(base64.decode(base64.normalize(body)));
                  final at = dec.lastIndexOf('@');
                  if (at >= 0) return dec.substring(at + 1).split(':').first;
                  return '';
                }
                return Uri.tryParse(c.link)?.host ?? '';
              } catch (_) {
                return '';
              }
            }

            String _hostOf(Cfg c) => _hosts.putIfAbsent(c.link, () {
                  final h = _rawHost(c);
                  if (h.length <= 8) return h;
                  return '${h.substring(0, 4)}****${h.substring(h.length - 4)}';
                });

            String _fullConfig(Cfg c) => c.isJson
                ? c.link
                : FlutterV2ray.parseFromURL(c.link).getFullConfiguration();

            /// کانفیگ نهایی؛ اگه تنظیمات DNS و مسیر دست‌نخورده باشن، کانفیگ اصلی برمی‌گرده.
            String _buildConfig(Cfg c) {
              final base = _fullConfig(c);
              final needsDns = !c.isJson && S.dnsPreset != 'default';
              final needsRoute = S.domainStrategy != 'default' ||
                  S.bypassIr ||
                  S.directDomains.trim().isNotEmpty ||
                  S.blockDomains.trim().isNotEmpty;
              if (!needsDns && !needsRoute && !S.perf && !S.fragment) return base;
              try {
                final decoded = jsonDecode(base);
                if (decoded is! Map) return base;
                final m = Map<String, dynamic>.from(decoded);
                try {
                  _tune(m);
                } catch (_) {}
                if (needsDns) {
                  final servers = S.dnsServers();
                  if (servers.isNotEmpty) {
                    m['dns'] = {'servers': servers, if (S.perf) 'queryStrategy': 'UseIPv4'};
                  }
                }
                if (needsRoute) {
                  final outs = (m['outbounds'] is List)
                      ? List<dynamic>.from(m['outbounds'] as List)
                      : <dynamic>[];
                  bool hasTag(String t) => outs.any((o) => o is Map && o['tag'] == t);
                  final routing = (m['routing'] is Map)
                      ? Map<String, dynamic>.from(m['routing'] as Map)
                      : <String, dynamic>{};
                  final rules = (routing['rules'] is List)
                      ? List<dynamic>.from(routing['rules'] as List)
                      : <dynamic>[];
                  final front = <dynamic>[];
                  final direct = <String>[
                    ...S.listOf(S.directDomains).map((d) => 'domain:$d'),
                    if (S.bypassIr) 'domain:ir',
                  ];
                  final block = S.listOf(S.blockDomains).map((d) => 'domain:$d').toList();
                  if (direct.isNotEmpty) {
                    if (!hasTag('direct')) {
                      outs.add({'protocol': 'freedom', 'tag': 'direct', 'settings': {}});
                    }
                    front.add(
                        {'type': 'field', 'domain': direct, 'outboundTag': 'direct'});
                  }
                  if (block.isNotEmpty) {
                    if (!hasTag('block')) {
                      outs.add({'protocol': 'blackhole', 'tag': 'block', 'settings': {}});
                    }
                    front
                        .add({'type': 'field', 'domain': block, 'outboundTag': 'block'});
                  }
                  routing['rules'] = [...front, ...rules];
                  if (S.domainStrategy != 'default') {
                    routing['domainStrategy'] = S.domainStrategy;
                  }
                  m['routing'] = routing;
                  m['outbounds'] = outs;
                }
                return jsonEncode(m);
              } catch (_) {
                return base;
              }
            }

              /// تنظیمات بهترین عملکرد برای نت ضعیف و کانفیگ‌های ضعیف
            void _tune(Map<String, dynamic> m) {
              const proxies = ['vmess', 'vless', 'trojan', 'shadowsocks'];
              final outsRaw = m['outbounds'];
              if (outsRaw is! List) return;
              final outs = List<dynamic>.from(outsRaw);

              if (S.perf) {
                // زمان‌بندی‌ها: اتصال کند زود رها نشه، اتصال مرده زود پاک بشه
                final policy = (m['policy'] is Map)
                    ? Map<String, dynamic>.from(m['policy'] as Map)
                    : <String, dynamic>{};
                final levels = (policy['levels'] is Map)
                    ? Map<String, dynamic>.from(policy['levels'] as Map)
                    : <String, dynamic>{};
                final l0 = (levels['0'] is Map)
                    ? Map<String, dynamic>.from(levels['0'] as Map)
                    : <String, dynamic>{};
                l0['handshake'] = 10;
                l0['connIdle'] = 300;
                l0['uplinkOnly'] = 2;
                l0['downlinkOnly'] = 3;
                levels['0'] = l0;
                policy['levels'] = levels;
                m['policy'] = policy;
                final dnsRaw = m['dns'];
                if (dnsRaw is Map && dnsRaw['queryStrategy'] == null) {
                  m['dns'] = {...Map<String, dynamic>.from(dnsRaw), 'queryStrategy': 'UseIPv4'};
                }
              }

              for (int i = 0; i < outs.length; i++) {
                final o = outs[i];
                if (o is! Map) continue;
                final proto = (o['protocol'] ?? '').toString();
                if (!proxies.contains(proto)) continue;
                final om = Map<String, dynamic>.from(o);
                final ss = (om['streamSettings'] is Map)
                    ? Map<String, dynamic>.from(om['streamSettings'] as Map)
                    : <String, dynamic>{};
                final net = (ss['network'] ?? 'tcp').toString();
                final sec = (ss['security'] ?? 'none').toString();
                final sock = (ss['sockopt'] is Map)
                    ? Map<String, dynamic>.from(ss['sockopt'] as Map)
                    : <String, dynamic>{};

                final fragOk = S.fragment &&
                    sec == 'tls' &&
                    (net == 'tcp' || net == 'ws' || net == 'grpc' || net == 'httpupgrade') &&
                    sock['dialerProxy'] == null;

                if (S.perf) {
                  sock['tcpKeepAliveIdle'] ??= 30;
                  sock['tcpKeepAliveInterval'] ??= 15;
                  sock['tcpNoDelay'] ??= true;
                  // آدرس سرور فقط با IPv4 پیدا بشه
                  sock['domainStrategy'] ??= 'UseIPv4';
                }

                if (fragOk) {
                  sock['dialerProxy'] = 'fragment';
                  if (!outs.any((e) => e is Map && e['tag'] == 'fragment')) {
                    outs.add({
                      'tag': 'fragment',
                      'protocol': 'freedom',
                      'settings': {
                        'fragment': {
                          'packets': 'tlshello',
                          'length': '100-200',
                          'interval': '10-20',
                        },
                      },
                      'streamSettings': {
                        'sockopt': {'tcpNoDelay': true},
                      },
                    });
                  }
                }

                if (sock.isNotEmpty) ss['sockopt'] = sock;
                if (ss.isNotEmpty) om['streamSettings'] = ss;
                outs[i] = om;
              }
              m['outbounds'] = outs;
            }

            Cfg? _byLink(String? link) {
              if (link == null) return null;
              for (final c in _configs) {
                if (c.link == link) return c;
              }
              return null;
            }

            String _subTitle(String url) {
              final n = _subInfo[url]?.name ?? '';
              if (n.isNotEmpty) return n;
              return Uri.tryParse(url)?.host ?? url;
            }

            /// مرتب‌سازی و ساخت ردیف‌های لیست (فقط آخر هر دور پینگ و موقع تغییر لیست)
            void _resort() {
              try {
                _resortImpl();
              } catch (_) {
                _rows = [
                  CfgGroup(null, 'Local', _configs.where((c) => c.sub == null).toList()),
                  for (final s in _subs)
                    CfgGroup(s, _subTitle(s), _configs.where((c) => c.sub == s).toList()),
                ];
              }
            }

            void _resortImpl() {
              final idx = <String, int>{
                for (int i = 0; i < _configs.length; i++) _configs[i].link: i,
              };
              int rank(Cfg c) {
                final p = _pings[c.link];
                if (p == null) return 1;
                if (p < 0) return 2;
                return 0;
              }

              int cmp(Cfg a, Cfg b) {
                if (_sort == 3) return idx[a.link]!.compareTo(idx[b.link]!);
                if (_sort == 2) {
                  final d = _nameOf(a).toLowerCase().compareTo(_nameOf(b).toLowerCase());
                  if (d != 0) return d;
                  return idx[a.link]!.compareTo(idx[b.link]!);
                }
                final ra = rank(a), rb = rank(b);
                if (ra != rb) return ra - rb;
                if (ra == 0) {
                  final d = _sort == 0
                      ? _cmpBest(a, b)
                      : _pings[a.link]!.compareTo(_pings[b.link]!);
                  if (d != 0) return d;
                }
                return idx[a.link]!.compareTo(idx[b.link]!);
              }

              final rows = <Object>[];
              final local = _configs.where((c) => c.sub == null).toList()..sort(cmp);
              rows.add(CfgGroup(null, 'Local', local));
              if (!_collapsed.contains('')) rows.addAll(local);
              for (final s in _subs) {
                final items = _configs.where((c) => c.sub == s).toList()..sort(cmp);
                rows.add(CfgGroup(s, _subTitle(s), items));
                if (!_collapsed.contains(s)) rows.addAll(items);
              }
              _rows = rows;
            }

            String? _bestLink() {
              Cfg? best;
              for (final c in _configs) {
                final p = _pings[c.link];
                if (p == null || p <= 0) continue;
                if (best == null || _cmpBest(c, best) < 0) best = c;
              }
              return best?.link;
            }

            // ---------- افزودن ----------

            Future<void> _handleInput(String input) async {
              final text = input.trim();
              if (text.isEmpty) return _toast(tr('چیزی پیدا نشد', 'Nothing found'));

              if (text.startsWith('{')) {
                try {
                  jsonDecode(text);
                  _addManual([text]);
                } catch (_) {
                  _toast(tr('JSON معتبر نیست', 'Invalid JSON'));
                }
                return;
              }

              final links = text.split(RegExp(r'[\r\n\s]+')).where(_isLink).toList();
              if (links.isNotEmpty) {
                _addManual(links);
                return;
              }

              if (text.startsWith('http://') || text.startsWith('https://')) {
                if (!_subs.contains(text)) _subs.add(text);
                await _save();
                await _updateOneSub(text);
                return;
              }
              _toast(tr('کانفیگ یا ساب معتبر نیست', 'Not a valid config or subscription'));
            }

            void _addManual(List<String> links) {
              int added = 0;
              final fresh = <Cfg>[];
              for (final l in links) {
                if (!_configs.any((c) => c.link == l)) {
                  final nc = Cfg(l, null);
                  _configs.add(nc);
                  fresh.add(nc);
                  added++;
                }
              }
              _selected ??= _configs.isNotEmpty ? _configs.first.link : null;
              _resort();
              setState(() {});
              _save();
              _toast(tr('$added کانفیگ اضافه شد', '$added config(s) added'));
              if (fresh.isNotEmpty) _pingConfigs(fresh, manual: true, tries: 2);
            }

